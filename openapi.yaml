              type: integer
              example: 45
            last_page:
              type: integer
              example: 3
    RoleResponse:
      type: object
      properties:
        message:
          type: string
          example: Opération effectuée avec succès.
        data:
          $ref: '#/components/schemas/Role'
    RoleListResponse:
      type: object
      properties:
        message:
          type: string
          example: Liste des rôles récupérée avec succès.
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    PermissionResponse:
      type: object
      properties:
