    /api/courses/{id}/terminer:
      post:
        tags:
        - Traitement / Affectation
        summary: Terminer une Course et attester les libérations
        operationId: courseFinish
        description: Le chauffeur affecté déclare la fin réelle puis l’instant effectif de libération du chauffeur et du véhicule,
          séparément. Les heures planifiées ne libèrent jamais une ressource. La Course passe à TERMINEE une seule fois ;
          les demandes ne sont pas automatiquement terminées et leurs résultats restent soumis aux règles A05/A06. Cette action
          ne couvre ni panne ni relais, qui exigent la procédure habilitée dédiée. Permission dédiée finish_course.
        security:
        - bearerAuth: []
        x-implementation-status: implemented
        x-contract-status: implemented
        x-permissions:
        - finish_course
        parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishCourseRequest'
        responses:
          '200':
            description: Course terminée et libérations attestées.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/CourseResponse'
          '401':
            $ref: '#/components/responses/Param401'
          '403':
            $ref: '#/components/responses/Param403'
          '404':
            $ref: '#/components/responses/Param404'
          '409':
            $ref: '#/components/responses/Param409'
          '422':
            $ref: '#/components/responses/Param422'
          '503':
            $ref: '#/components/responses/Param503'
