  - name: Entités géographiques
    description: Adresses de départ, destination et retour avec coordonnées facultatives.
  - name: Directions et Services
    description: Gestion des directions et des services de l’organisation.
  - name: Paramétrage
    description: Administration des référentiels et des paramètres de l’application.
  - name: Traitement / Affectation
