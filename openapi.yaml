            example:
              new_password: Nouveau#123
              new_password_confirmation: Nouveau#123
      x-current-operation:
        tags:
        - Authentification
        summary: Modifier son mot de passe
        description: 'Permet à l''utilisateur connecté de modifier son mot de passe.


          Première connexion : si must_change_password vaut true,

          current_password est facultatif (nullable) ; le client peut l’omettre.


          Changement normal : si must_change_password vaut false,

          current_password est obligatoire.

          '
        x-original-operation-id: changePassword
        requestBody:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordRequest'
              examples:
                premiere_connexion:
                  summary: Première connexion avec mot de passe temporaire
                  value:
                    new_password: Nouveau#8
                    new_password_confirmation: Nouveau#8
                changement_normal:
                  summary: Changement normal de mot de passe
                  value:
                    current_password: Ancien#8
                    new_password: Nouveau#8
                    new_password_confirmation: Nouveau#8
          required: true
        responses:
          '200':
            description: Mot de passe modifié avec succès
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PasswordChangedResponse'
          '401':
            description: Non authentifié ou ancien mot de passe incorrect lors d'un changement normal
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/ErrorResponse'
                example:
                  message: L’ancien mot de passe est incorrect.
          '422':
            description: Données fournies invalides
            content:
