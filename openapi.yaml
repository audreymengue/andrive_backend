components:
  schemas:
    CoursePreparationUpdate:
      type: object
      additionalProperties: false
      required:
      - version_attendue
      - demande_ids
      properties:
        version_attendue:
          type: integer
          minimum: 0
        demande_ids:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 1
        chauffeur_id:
          type: integer
          minimum: 1
          nullable: true
          description: Profil candidat non affecté. Omettre pour conserver la sélection ; null pour l'effacer.
        vehicule_id:
          type: integer
          minimum: 1
          nullable: true
          description: Profil candidat non affecté. Omettre pour conserver la sélection ; null pour l'effacer.
        plan:
          type: object
          allOf:
          - $ref: '#/components/schemas/CoursePreparationDraftPlan'
          nullable: true
          description: Plan préparatoire complet saisi par la DAG. Omettre pour conserver celui de la version courante ; null
            pour l'effacer. Un objet remplace le plan courant ; les propriétés omises dans l'objet sont considérées nulles
            ou vides.
    CourseTransitionRequest:
      type: object
      additionalProperties: false
      required:
      - version_attendue
      properties:
        version_attendue:
          type: integer
          minimum: 0
    ConfirmCourseRequest:
      type: object
      additionalProperties: false
      required:
      - version_attendue
      - motif
      properties:
        version_attendue:
          type: integer
          minimum: 0
        motif:
          type: string
          minLength: 1
          maxLength: 1000
    FinishCourseRequest:
      type: object
      additionalProperties: false
      required:
      - version_attendue
      - fin_reelle
      - chauffeur_libere_a
      - vehicule_libere_a
      properties:
        version_attendue:
          type: integer
          minimum: 0
        fin_reelle:
          type: string
          format: date-time
        chauffeur_libere_a:
          type: string
          format: date-time
          description: Instant attesté de libération physique du chauffeur.
        vehicule_libere_a:
          type: string
          format: date-time
          description: Instant attesté de retour/libération physique du véhicule.
    CoursePreparationDraftPlan:
      type: object
      additionalProperties: false
      properties:
        occupation_debut_prevue:
          type: string
          format: date-time
          nullable: true
          description: Début de mobilisation estimé par la DAG, incluant le repositionnement utile.
        occupation_fin_prevue:
          type: string
          format: date-time
          nullable: true
          description: Fin de mobilisation estimée par la DAG, incluant le repositionnement utile.
        chargement_confirme:
          type: boolean
          nullable: true
          description: Validation manuelle de compatibilité par la DAG ; aucune capacité n'est calculée par l'API.
        arrets:
          type: array
          items:
            $ref: '#/components/schemas/CoursePreparationStop'
    CoursePreparationStop:
      type: object
      additionalProperties: false
      required:
      - ordre
      - lieu
      properties:
        ordre:
          type: integer
          minimum: 1
        lieu:
          type: string
          minLength: 1
          maxLength: 255
        heure_prevue:
          type: string
          format: date-time
          nullable: true
        employes:
          type: array
          items:
            $ref: '#/components/schemas/CoursePreparationStopEmploye'
        objets:
          type: array
          items:
            $ref: '#/components/schemas/CoursePreparationStopObjet'
    CoursePreparationStopEmploye:
      type: object
      additionalProperties: false
      required:
      - demande_employe_id
      - action
      properties:
        demande_employe_id:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
          - PRISE_EN_CHARGE
          - DEPOSE
    CoursePreparationStopObjet:
      type: object
      additionalProperties: false
      required:
      - demande_objet_id
      - action
      properties:
        demande_objet_id:
          type: integer
          minimum: 1
        action:
          type: string
          enum:
          - PRISE_EN_CHARGE
          - DEPOSE
    CoursePreparationVersion:
      type: object
      additionalProperties: false
      required:
      - version
      - actor_id
      - demande_ids
      - chauffeur_id
      - vehicule_id
      - plan
      - created_at
      properties:
        version:
          type: integer
          minimum: 1
        actor_id:
          type: integer
          minimum: 1
        demande_ids:
          type: array
          items:
            type: integer
            minimum: 1
        chauffeur_id:
          type: integer
          minimum: 1
          nullable: true
        vehicule_id:
          type: integer
          minimum: 1
          nullable: true
        plan:
          type: object
          allOf:
          - $ref: '#/components/schemas/CoursePreparationDraftPlan'
          nullable: true
        created_at:
          type: string
          format: date-time
    Course:
      type: object
      additionalProperties: false
      required:
      - id
      - statut_execution
      - lock_version
      - version_preparation
      - demande_ids
      - chauffeur_id
      - vehicule_id
      - plan
      - demarree_a
      - terminee_a
      - chauffeur_libere_a
      - vehicule_libere_a
      - preparations
      - created_by_id
      - created_at
      - updated_at
      properties:
        id:
          type: integer
          minimum: 1
        statut_execution:
          type: string
          nullable: true
          enum:
          - A_VENIR
          - EN_COURS
          - TERMINEE
          - ANNULEE
        lock_version:
          type: integer
          minimum: 0
        version_preparation:
          type: integer
          minimum: 1
        demande_ids:
          type: array
          items:
            type: integer
            minimum: 1
        chauffeur_id:
          type: integer
          minimum: 1
          nullable: true
        vehicule_id:
          type: integer
          minimum: 1
          nullable: true
        plan:
          type: object
          allOf:
          - $ref: '#/components/schemas/CoursePreparationDraftPlan'
          nullable: true
        demarree_a:
          type: string
          format: date-time
          nullable: true
        terminee_a:
          type: string
          format: date-time
          nullable: true
        chauffeur_libere_a:
          type: string
          format: date-time
          nullable: true
        vehicule_libere_a:
          type: string
          format: date-time
          nullable: true
        preparations:
          type: array
          items:
            $ref: '#/components/schemas/CoursePreparationVersion'
        created_by_id:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CourseResponse:
      type: object
      additionalProperties: false
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/Course'
    CourseListResponse:
      type: object
      additionalProperties: false
      required:
      - message
      - data
      - meta
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        meta:
          $ref: '#/components/schemas/ParamMeta'
    TreatmentDemandeSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - reference
      - statut
      - direction
      - service
      - date_depart
      - heure_depart
      - personnes_count
      - objets_count
      properties:
        id:
          type: integer
          minimum: 1
        reference:
          type: string
          maxLength: 20
        statut:
          type: string
          enum:
          - EN_ATTENTE
        direction:
          type: object
          additionalProperties: false
          required:
          - id
          - nom
          properties:
            id:
              type: integer
              minimum: 1
            nom:
              type: string
        service:
          type: object
          nullable: true
          additionalProperties: false
          required:
          - id
          - nom
          - code
          properties:
            id:
              type: integer
              minimum: 1
            nom:
              type: string
            code:
              type: string
        date_depart:
          type: string
          format: date
        heure_depart:
          type: string
          pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$
        personnes_count:
          type: integer
          minimum: 0
        objets_count:
          type: integer
          minimum: 0
    TreatmentDemandeListResponse:
      type: object
      additionalProperties: false
      required:
      - message
      - data
      - meta
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentDemandeSummary'
        meta:
          $ref: '#/components/schemas/ParamMeta'
    Direction:
      type: object
      required:
      - id
      - nom
      - code
      - description
      - statut
      properties:
        id:
          type: integer
        nom:
          type: string
        code:
          type: string
        description:
          type: string
          nullable: true
        statut:
          type: string
          description: Statut enregistré dans la table directions.
    DirectionListResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
