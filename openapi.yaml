        critique cohérente. Ne pas rejouer automatiquement après perte de réponse : ancien token peut déjà être révoqué. current_password
        requis seulement hors premier changement ; confirmation obligatoire ; mot de passe différent vérifié par hash.

        Autorisations : authenticated. Permissions : aucune permission RBAC.

        Auth : pas de permission RBAC pour son propre compte ; compte actif ; me/password/logout accessibles pendant changement
        obligatoire.

        Exception changement obligatoire ; pas de réponse token conservée dans idempotence.'
