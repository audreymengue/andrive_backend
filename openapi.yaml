  components:
    schemas:
      CoursePreparationUpdate:
        type: object
        additionalProperties: false
        required:
        - version_attendue
        - demande_ids
        properties:
          version_attendue:
            type: integer
            minimum: 0
          demande_ids:
            type: array
            uniqueItems: true
            items:
              type: integer
              minimum: 1
          chauffeur_id:
            type: integer
            minimum: 1
            nullable: true
            description: Profil candidat non affecté. Omettre pour conserver la sélection ; null pour l'effacer.
          vehicule_id:
            type: integer
            minimum: 1
            nullable: true
            description: Profil candidat non affecté. Omettre pour conserver la sélection ; null pour l'effacer.
          plan:
            allOf:
            - $ref: '#/components/schemas/CoursePreparationDraftPlan'
            nullable: true
            description: Plan préparatoire complet saisi par la DAG. Omettre pour conserver celui de la version courante ;
              null pour l'effacer. Un objet remplace le plan courant ; les propriétés omises dans l'objet sont considérées
              nulles ou vides.
      CourseTransitionRequest:
        type: object
        additionalProperties: false
        required:
        - version_attendue
        properties:
          version_attendue:
            type: integer
            minimum: 0
      ConfirmCourseRequest:
        type: object
        additionalProperties: false
        required:
        - version_attendue
        - motif
        properties:
          version_attendue:
            type: integer
            minimum: 0
          motif:
            type: string
            minLength: 1
            maxLength: 1000
      FinishCourseRequest:
        type: object
        additionalProperties: false
        required:
