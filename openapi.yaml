    parameters:
      DemandeId:
        name: id
        in: path
        required: true
        description: Identifiant numérique de la ressource.
        schema:
          type: integer
          minimum: 1
      ParamResourceId:
        name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      ParamIdempotencyKey:
        name: Idempotency-Key
        in: header
        required: true
        description: 'Même clé et même intention : un seul effet après réautorisation. Une intention différente exige une
          nouvelle clé UUID.'
        schema:
          type: string
          format: uuid
      ParamPage:
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      ParamPerPage:
        name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      ParamSearch:
        name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      ParamStatus:
        name: statut
        in: query
        required: false
        schema:
          type: string
          enum:
          - ACTIF
          - INACTIF
    securitySchemes:
      bearerAuth:
        type: http
        description: 'Token d''authentification Laravel Sanctum.


          Format :

          Bearer {token}

          '
        scheme: bearer
        bearerFormat: Sanctum
    responses:
      Param401:
        description: HTTP 401 — Non authentifié ou réauthentification incorrecte.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamError'
            examples:
              standard:
                value:
                  message: Non authentifié ou réauthentification incorrecte.
                  code: UNAUTHENTICATED
      Param403:
        description: HTTP 403 — Vous n’avez pas la permission d’effectuer cette action.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamError'
            examples:
              standard:
                value:
                  message: Vous n’avez pas la permission d’effectuer cette action.
                  code: FORBIDDEN
              passwordChangeRequired:
                value:
                  message: Vous devez modifier votre mot de passe avant de poursuivre.
                  code: PASSWORD_CHANGE_REQUIRED
      Param404:
        description: HTTP 404 — Ressource introuvable.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamError'
            examples:
              standard:
                value:
                  message: Ressource introuvable.
                  code: NOT_FOUND
      Param409:
        description: HTTP 409 — La version a changé. Rechargez les données avant de confirmer.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamError'
            examples:
              standard:
                value:
                  message: La version a changé. Rechargez les données avant de confirmer.
                  code: VERSION_CONFLICT
              LAST_EFFECTIVE_ADMIN:
                value:
                  message: Le dernier administrateur effectif ne peut pas être retiré.
                  code: LAST_EFFECTIVE_ADMIN
              SYSTEM_OBJECT_PROTECTED:
                value:
                  message: Cette identité ou ce socle système est protégé.
                  code: SYSTEM_OBJECT_PROTECTED
              REFERENCE_IN_USE:
                value:
                  message: Cette référence est utilisée ou historiquement protégée.
                  code: REFERENCE_IN_USE
              IDEMPOTENCY_CONFLICT:
                value:
                  message: La clé a déjà été utilisée pour une autre intention.
                  code: IDEMPOTENCY_CONFLICT
              TEMPORARY_PASSWORD_UNAVAILABLE:
                value:
                  message: Le temporaire n’est plus disponible pour cette génération.
                  code: TEMPORARY_PASSWORD_UNAVAILABLE
      Param422:
        description: HTTP 422 — Les données fournies sont invalides.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamValidationError'
            examples:
              standard:
                value:
                  message: Les données fournies sont invalides.
                  errors:
                    direction_id:
                    - Une direction valide est obligatoire.
      Param429:
        description: HTTP 429 — Trop de tentatives. Réessayez plus tard.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamError'
            examples:
              standard:
                value:
                  message: Trop de tentatives. Réessayez plus tard.
                  code: RATE_LIMITED
        headers:
          Retry-After:
            description: Délai en secondes avant nouvelle tentative.
            schema:
              type: integer
              minimum: 1
            example: 60
      Param503:
        description: HTTP 503 — Opération temporairement indisponible, aucun changement partiel validé.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamError'
            examples:
              standard:
                value:
                  message: Opération temporairement indisponible, aucun changement partiel validé.
                  code: TEMPORARILY_UNAVAILABLE
