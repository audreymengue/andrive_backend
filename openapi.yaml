        opaque et obligation de changement. Aucun profil/secret temporaire. Mauvais identifiants 401 ; compte inactif 403.
        Le rate limiter conserve 5/minute email+IP.

        Autorisations : public. Permissions : aucune permission RBAC.

        Auth : pas de permission RBAC pour son propre compte ; compte actif ; me/password/logout accessibles pendant changement
        obligatoire.

        Pas de refresh-token ni de JWT.'
