        longitude:
          type: string
          nullable: true
          description: Coordonnée décimale à sept chiffres après la virgule.
        description:
          type: string
          nullable: true
    CreateEntiteGeographiqueRequest:
      type: object
      required:
      - adresse
      properties:
        adresse:
          type: string
          minLength: 1
          maxLength: 255
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
    UpdateEntiteGeographiqueRequest:
      type: object
      properties:
        adresse:
          type: string
          minLength: 1
          maxLength: 255
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        description:
          type: string
          nullable: true
    DestinationDemandeResponse:
      type: object
      required:
      - ordre
      - entite_geographique
      properties:
        ordre:
          type: integer
          minimum: 1
        entite_geographique:
          $ref: '#/components/schemas/EntiteGeographique'
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 255
          description: Adresse email utilisée pour la connexion
          format: email
          example: jean@aninf.ga
        password:
          type: string
          description: Mot de passe
          format: password
          example: Mot#2026
    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Connexion réussie.
        data:
          type: object
          properties:
            token:
              type: string
              description: Token Laravel Sanctum
              example: 1|xxxxxxxxxxxxxxxxxxxxxxxx
            must_change_password:
              type: boolean
              description: Indique si le changement de mot de passe est obligatoire
              example: true
    ChangePasswordRequest:
      required:
      - new_password
      - new_password_confirmation
      type: object
      description: 'current_password est obligatoire uniquement lorsque must_change_password vaut false.

        Lorsqu''il vaut true, l''utilisateur définit son premier mot de passe en pouvant l’omettre,

        et ne peut pas réutiliser le mot de passe temporaire.

        '
      properties:
        current_password:
          type: string
          nullable: true
          description: Obligatoire uniquement pour un changement normal de mot de passe
          format: password
          example: Ancien#8
        new_password:
          type: string
          description: Nouveau mot de passe de 8 à 12 caractères
          format: password
          minLength: 8
          maxLength: 12
          example: Nouveau#8
        new_password_confirmation:
          type: string
          description: Confirmation du nouveau mot de passe de 8 à 12 caractères
          format: password
          minLength: 8
          maxLength: 12
          example: Nouveau#8
    User:
      $ref: '#/components/schemas/ParamUser'
