x-current-contract:
  openapi: 3.0.4
  info:
    title: API - Gestion des sorties ANINF
    description: 'API REST de l''application de gestion des sorties de l''ANINF.


      Cette API permet notamment de gérer :

      - l''authentification des utilisateurs ;

      - les utilisateurs ;

      - les rôles ;

      - les permissions ;

      - les demandes de sortie.


      Authentification :

      Laravel Sanctum avec Bearer Token.


      Lorsqu''un utilisateur doit modifier son mot de passe, seuls GET /api/me,

      POST /api/logout et PUT /api/me/password restent accessibles. Les endpoints

      métier retournent alors HTTP 403 avec le message « Vous devez modifier votre

      mot de passe avant de poursuivre. ».


      Directions et Services : endpoints présents dans la copie aninf-api-test, testés sur aninf_test uniquement. Utilisateurs,
      rôles et permissions : administration sécurisée, versions, idempotence et audit dans la copie de test ; révélation dédiée
      du temporaire. Consultation des historiques organisationnels et des audits administratifs/maintenance disponible sous
      les permissions documentées. Les autres parties du Paramétrage et Traitement/Affectation restent hors de ce lot.'
    version: 1.0.0
  servers:
  - url: /
    description: Origine de la copie Laravel de test à configurer dans le client. Aucun mock public présélectionné.
  tags:
  - name: Authentification
    description: Connexion et gestion du compte connecté
  - name: Utilisateurs
    description: Gestion des utilisateurs
  - name: Roles
    description: Gestion des rôles
  - name: Permissions
    description: Gestion des permissions
  - name: Demandes
