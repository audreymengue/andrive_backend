    CreatePermissionRequest:
      required:
      - code
      - libelle
      type: object
      properties:
        libelle:
          type: string
          minLength: 1
          maxLength: 255
          example: Créer un utilisateur
        code:
          type: string
          minLength: 1
          maxLength: 255
          example: create_user
        description:
          type: string
          nullable: true
          example: Permet de créer un utilisateur
    UpdatePermissionRequest:
      type: object
      properties:
        libelle:
          type: string
          minLength: 1
          maxLength: 255
          example: Créer un utilisateur
        code:
          type: string
          minLength: 1
          maxLength: 255
          example: create_user
        description:
          type: string
          nullable: true
          example: Permet de créer un utilisateur
