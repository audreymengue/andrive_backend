        description: 'Instantanes en liste blanche selon object_type. Champs presents seulement si enregistres et correctement
          types. Objet inconnu : objet vide ; refus : operation seulement. Aucun password/hash/copie chiffree/token/cookie/en-tete
          de connexion. Les textes libres autorises ne doivent pas contenir de secret.'
      ParametrageAuditEvent:
        type: object
        additionalProperties: false
        properties:
          id:
            type: string
            pattern: ^(administration|maintenance):[1-9][0-9]*$
            example: maintenance:42
            description: Identifiant stable compose de la source et de son identifiant local. Les tables ont des sequences
              independantes.
          source:
            type: string
            enum:
            - administration
            - maintenance
          source_id:
            type: integer
            format: int64
          actor_id:
            type: integer
            format: int64
            nullable: true
          origine:
            type: string
            nullable: true
            description: Identite technique enregistree pour la maintenance. Null pour les evenements administratifs sans
              origine technique stockee ; aucun faux auteur humain.
          action:
            type: string
            nullable: true
            description: Action enregistree ; null pour les evenements de maintenance qui n'en enregistrent pas.
          object_type:
            type: string
          object_id:
            type: integer
            format: int64
          resultat:
            type: string
            nullable: true
            enum:
            - SUCCES
            - REFUSE
            description: 'Projection des conventions verifiees des writers actuels : refus => REFUSE, mutation reussie ou
              origine de maintenance connue => SUCCES. Null si la convention historique est inconnue. Resultat non stocke
              separement dans les anciennes tables.'
          motif:
            type: string
            nullable: true
          before_values:
            $ref: '#/components/schemas/ParametrageAuditValues'
          after_values:
            $ref: '#/components/schemas/ParametrageAuditValues'
          command_key:
            type: string
            format: uuid
          created_at:
            type: string
            format: date-time
          schema_version:
            type: integer
            enum:
            - 1
            description: Version du format de consultation, pas une version historique ajoutee aux evenements.
        required:
        - id
        - source
        - source_id
        - actor_id
        - origine
        - action
        - object_type
        - object_id
        - resultat
        - motif
        - before_values
        - after_values
        - command_key
        - created_at
        - schema_version
