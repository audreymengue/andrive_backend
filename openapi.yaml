    CreateDemandeRequest:
      type: object
      required:
      - direction_id
      - type_sortie_id
      - adresse_depart_id
      - date_depart
      - heure_depart
      - motif
      - destinations
      - employes
      properties:
        direction_id:
          type: integer
          minimum: 1
          example: 2
        type_sortie_id:
          type: integer
          minimum: 1
          description: Type de sortie existant choisi dans le référentiel administré.
        adresse_depart_id:
          type: integer
          minimum: 1
          description: Entité géographique de départ existante.
        adresse_retour_id:
          type: integer
          minimum: 1
          nullable: true
          description: Entité géographique de retour, facultative et indépendante du départ.
        date_depart:
          type: string
          format: date
          example: '2026-10-05'
        heure_depart:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          example: 08:00:00
        heure_retour:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$'
          nullable: true
          description: Lorsqu’elle est fournie, elle doit être strictement postérieure à heure_depart.
          example: '16:30:00'
        motif:
          type: string
          minLength: 1
          example: Mission de service
        commentaire:
          type: string
          nullable: true
          example: Prévoir un véhicule adapté.
        destinations:
          type: array
          minItems: 1
          description: Les valeurs ordre doivent être distinctes dans la liste.
          items:
            $ref: '#/components/schemas/DestinationDemandeInput'
        employes:
          type: array
          minItems: 1
          description: Employés saisis directement dans la demande ; aucun employe_id n’est attendu.
          items:
            $ref: '#/components/schemas/EmployeDemandeInput'
        objets:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ObjetDemandeInput'
