openapi: 3.0.4
info:
  title: ANINF — Contrat API Paramétrage, Traitement/Affectation et Transport
  version: 1.3.0-transport-target
  description: 'Contrat de référence Paramétrage, Traitement/Affectation et Transport V1. Le champ x-implementation-status
    indique la disponibilité réelle de chaque opération : implemented signifie que la route et son comportement sont implémentés
    et vérifiés ; partial signifie que seule la partie décrite par x-current-operation est disponible ; not-implemented signifie
    que l’opération reste à développer.

    Le périmètre Course actuellement implémenté couvre la consultation des demandes à traiter, la préparation et la consultation
    des Courses, leur confirmation, leur démarrage et leur fin réelle. La préparation ne réserve aucune ressource ; la confirmation
    réserve les ressources sur l’intervalle déclaré après vérification manuelle du chargement, sans calcul automatique de
    capacité.

    Le chauffeur atteste la fin réelle de la Course et la libération effective du chauffeur et du véhicule séparément. Une
    échéance estimée ne libère jamais une ressource. La fin d’une Course ne fait pas passer automatiquement les demandes à
    TERMINEE. Le périmètre Transport comprend la déclaration de signalements, les périodes d’indisponibilité et la remise
    en service explicite. Leur état d’implémentation est indiqué opération par opération ; les validations institutionnelles
    A01, A07 et A17 restent des prérequis de mise en service. Les clients frontend/mobile doivent s’appuyer sur le statut
    de chaque opération.'
servers:
- url: /
  description: Origine de votre API à configurer dans Angular/Flutter. Aucun serveur actif vérifié.
tags:
- name: Authentification
  description: Connexion et gestion du compte connecté Les opérations portent leur état réel dans x-implementation-status.
- name: Utilisateurs
  description: Gestion des utilisateurs Les opérations portent leur état réel dans x-implementation-status.
- name: Roles
  description: Gestion des rôles Les opérations portent leur état réel dans x-implementation-status.
- name: Permissions
  description: Gestion des permissions Les opérations portent leur état réel dans x-implementation-status.
- name: Demandes
  description: Création, consultation, soumission, modification et annulation des demandes de sortie Les opérations portent
    leur état réel dans x-implementation-status.
- name: Directions
  description: Lecture des directions pour les formulaires de demande. Les opérations portent leur état réel dans x-implementation-status.
- name: Types de sortie
  description: Référentiel administré ; aucune valeur métier préinstallée. Les opérations portent leur état réel dans x-implementation-status.
- name: Entités géographiques
  description: Adresses de départ, destination et retour avec coordonnées facultatives. Les opérations portent leur état réel
    dans x-implementation-status.
- name: Traitement / Affectation
  description: Demandes à traiter, préparation non réservante, confirmation et suivi des Courses ; utiliser x-implementation-status
    pour déterminer les opérations disponibles.
- name: Transport
  description: Signalements chauffeur, périodes d’indisponibilité des ressources et remise en service explicite. Routes implémentées
    ; les permissions restent à attribuer explicitement selon A17 et la visibilité des signalements reste soumise à A07.
- name: Cible — Authentification
  description: Contrat cible Paramétrage, pas une implémentation backend.
- name: Cible — Utilisateurs
  description: Contrat cible Paramétrage, pas une implémentation backend.
- name: Cible — Rôles
  description: Contrat cible Paramétrage, pas une implémentation backend.
- name: Cible — Permissions
  description: Contrat cible Paramétrage, pas une implémentation backend.
- name: Cible — Référentiels
  description: Contrat cible Paramétrage, pas une implémentation backend.
- name: Cible — Paramétrage
  description: Contrat cible Paramétrage, pas une implémentation backend.
- name: Cible — Audit
  description: Contrat cible Paramétrage, pas une implémentation backend.
paths:
  /api/directions:
    get:
      tags:
      - Cible — Référentiels
      summary: listOperationalDirection
      operationId: param_listOperationalDirection
      description: 'listOperationalDirection

        Autorisations : compte actif et permission effective read_direction. Le rôle dépend des permissions attribuées ; cette
        opération ne limite pas l’accès à une liste fixe de noms de rôles.

        Compte ACTIF et must_change_password=false, sauf exceptions Auth. Droits effectifs des seuls rôles actifs ; contrôle
        serveur de portée.

        Liste sélectionnable uniquement : statut ACTIF ; pas d’archives ni d’administration.'
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        required: false
        schema:
          type: string
          maxLength: 255
      responses:
        '200':
          description: Succès cible, nécessite développement backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParamDirectionListResponse'
              example:
                message: Opération effectuée avec succès (exemple cible).
                data: []
                meta:
                  current_page: 1
                  per_page: 20
                  total: 0
                  last_page: 1
        '401':
          $ref: '#/components/responses/Param401'
        '403':
          $ref: '#/components/responses/Param403'
        '422':
          $ref: '#/components/responses/Param422'
      x-implementation-status: implemented
      x-contract-status: implemented
      x-permissions:
      - read_direction
      x-business-rules:
      - Compte ACTIF et must_change_password=false, sauf exceptions Auth. Droits effectifs des seuls rôles actifs ; contrôle
        serveur de portée.
      - 'Liste sélectionnable uniquement : statut ACTIF ; pas d’archives ni d’administration.'
      x-status-transitions: []
      x-blocking-decisions: []
      x-contract-controls:
        unknown_fields: Rejet 422 côté cible pour les champs non décrits, notamment mot de passe/hash, statut injecté et identité
          système.
        references: 404 identifiant absent ; 422 incohérence de formulaire ; 409 état modifié entre validation et mutation.
    post:
      tags:
      - Cible — Paramétrage
      summary: Créer une direction
      operationId: param_createDirection
      description: 'Route implémentée conformément au comportement vérifié. createDirection

        Autorisations : super_admin. Permissions : create_direction.

        Compte ACTIF et must_change_password=false, sauf exceptions Auth. Droits effectifs des seuls rôles actifs ; contrôle
        serveur de portée.

        ACTIF par défaut.

        Code stable si présent ; pas de donnée officielle préinstallée.

        Rôle système super_admin ACTIF ET permission de l’opération. Socle administratif protégé ; aucune compétence métier
        automatique.'
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: 'Même clé et intention : un seul effet, après réautorisation ; aucun secret mémorisé.'
      responses:
        '201':
          description: Succès.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParamDirectionResponse'
              example:
                message: Opération effectuée avec succès (exemple cible).
                data:
                  id: 2
                  nom: Direction fictive pour intégration
                  code: DIR_EXEMPLE
                  description: null
                  statut: ACTIF
                  lock_version: 1
        '401':
          $ref: '#/components/responses/Param401'
        '403':
          $ref: '#/components/responses/Param403'
        '409':
          $ref: '#/components/responses/Param409'
        '422':
          $ref: '#/components/responses/Param422'
        '503':
          $ref: '#/components/responses/Param503'
      x-implementation-status: implemented
      x-contract-status: target-defined
      x-authorized-roles:
      - super_admin
      x-permissions:
      - create_direction
      x-business-rules:
      - Compte ACTIF et must_change_password=false, sauf exceptions Auth. Droits effectifs des seuls rôles actifs ; contrôle
        serveur de portée.
      - ACTIF par défaut.
      - Code stable si présent ; pas de donnée officielle préinstallée.
      - Rôle système super_admin ACTIF ET permission de l’opération. Socle administratif protégé ; aucune compétence métier
        automatique.
      x-status-transitions: []
      x-blocking-decisions: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParamCreateDirection'
            example:
              nom: Exemple
              code: Exemple
      x-contract-controls:
        unknown_fields: Rejet 422 côté cible pour les champs non décrits, notamment mot de passe/hash, statut injecté et identité
          système.
        references: 404 identifiant absent ; 422 incohérence de formulaire ; 409 état modifié entre validation et mutation.
  /api/login:
