        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
            - L'adresse email est obligatoire.
            password:
            - Le mot de passe est obligatoire.
    DemandeReference:
      type: string
      description: Référence métier générée par le serveur au format JJ-MM-AA-XXXX.
      pattern: ^(?:(?:0[1-9]|[12][0-9]|3[01])-(?:0[1-9]|1[0-2])-\d{2}-(?:000[1-9]|00[1-9]\d|0[1-9]\d{2}|1000))$
